const STUDY_CARDS=[{"id":"mat-hundred","cat":"Mat","q":"Hundred 的呼吸與總拍數是什麼？","a":"吸氣五拍、吐氣五拍，總計十組完整呼吸與一百次手臂拍動。","source":"Module 2 Exercise Guide p.2、p.12","move":"Hundred","cue":"「吸、二三四五；吐、二三四五。保持身體中心穩定。」"},{"id":"mat-rollup","cat":"Mat","q":"Roll Up 的建議次數與核心目標？","a":"5 次；核心重點是控制脊椎逐節捲起、捲下，訓練腹部控制。","source":"Module 2 Exercise Guide p.2、p.14","move":"Roll Up","cue":"「下巴往胸口，慢慢捲上來；腹部往內提，逐節回到墊子。」"},{"id":"mat-circle","cat":"Mat","q":"One Leg Circle 最重要的穩定目標是？","a":"骨盆與軀幹保持穩定，腿在髖關節移動；每個方向 5 次。","source":"Module 2 Exercise Guide p.2、p.16–17","move":"One Leg Circle","cue":"「畫圈的時候骨盆保持安定，讓腿從髖部自由移動。」"},{"id":"mat-rolling","cat":"Mat","q":"Rolling Like a Ball 為何不安排在第一次上課？","a":"Level I 的清單標示首堂課省略；可先練習平衡的起始位置而非整個後滾。","source":"Module 2 Exercise Guide p.2、p.19","move":"Rolling Like a Ball","cue":"「先把身體保持圓弧，練習停穩；今天先不加後滾。」"},{"id":"mat-scissors","cat":"Mat","q":"Scissors（Single Straight Leg Stretch）的次數與節奏？","a":"6–10 次，保持穩定軀幹，雙腿交替延伸；口令可用「拉、拉、換」。","source":"Module 2 Exercise Guide p.2、p.24–25","move":"Single Straight Leg Stretch","cue":"「上面的腿拉、拉，換邊；腹部向內提，保持軀幹穩定。」"},{"id":"mat-crisscross","cat":"Mat","q":"Criss Cross 的身體動作目標是什麼？","a":"以 Powerhouse 控制軀幹旋轉，鍛鍊腹斜肌；做 6–10 次。","source":"Module 2 Exercise Guide p.2、p.28–29","move":"Criss Cross","cue":"「從身體中心轉向對側膝蓋，骨盆不要跟著搖晃。」"},{"id":"mat-rocker","cat":"Mat","q":"Open Leg Rocker Prep 建議維持多久？","a":"維持約 10 秒；先要求軀幹 C-Curve 與穩定平衡，不急著拉直腿。","source":"Module 2 Exercise Guide p.2、p.32–33","move":"Open Leg Rocker Prep","cue":"「坐骨找到平衡點，向上拉長；腿不一定要伸直。」"},{"id":"mat-corkscrew","cat":"Mat","q":"Corkscrew I 的次數與控制重點是什麼？","a":"每個方向 2–4 次；腿畫圈、骨盆穩定，先以小圈練習控制。","source":"Module 2 Exercise Guide p.2、p.34–35","move":"Corkscrew I","cue":"「雙腿一起畫小圈，讓骨盆穩穩留在墊子上。」"},{"id":"mat-saw","cat":"Mat","q":"Saw 如何搭配呼吸？","a":"先坐高、吸氣旋轉，再吐氣向前延伸；每方向 3–5 次，重視完整吐氣。","source":"Module 2 Exercise Guide p.2、p.36–37","move":"Saw","cue":"「先坐高、吸氣轉過去；吐氣再往前延伸，慢慢把氣吐完。」"},{"id":"mat-bridge","cat":"Mat","q":"Shoulder Bridge Prep 的次數與重點？","a":"3–5 次；骨盆抬起時保持穩定，下降時練習脊椎逐節回到墊子。","source":"Module 2 Exercise Guide p.2、p.40–41","move":"Shoulder Bridge Prep","cue":"「骨盆往上抬，停一下；胸口、肋骨、骨盆依序放回。」"},{"id":"mat-teaser","cat":"Mat","q":"Teaser I 的建議次數與教學難點？","a":"3–5 次；需要 Powerhouse 控制身體捲起、捲下，必要時使用 Building Blocks。","source":"Module 2 Exercise Guide p.2、p.7","move":"Teaser I","cue":"「從腹部帶動身體捲起，先維持控制，不用急著伸直雙腿。」"},{"id":"mat-mermaid","cat":"Mat","q":"Mermaid Stretch 的次數與教學重點？","a":"每側 2–3 次；重視身體側向延伸與呼吸。","source":"Module 2 Exercise Guide p.2、p.6","move":"Mermaid Stretch","cue":"「坐穩、吸氣拉高，吐氣往側邊延伸，讓肋骨有空間。」"},{"id":"ref-foot","cat":"Reformer","q":"Footwork 的 4 個位置及建議彈簧／次數？","a":"Toes、Arches、Heels、Tendon Stretch；每位置 10 次、原參考表為 3–4 條彈簧，實際仍需依器械與學員調整。","source":"Module 2 Exercise Guide p.3","move":"Footwork: Toes","cue":"「從身體中心把滑床推遠，再有控制地收回來。」"},{"id":"ref-hundred","cat":"Reformer","q":"Reformer Hundred 的彈簧與呼吸？","a":"清單標示 3–4 條彈簧；吸五拍、吐五拍，共 100 次拍動。必須確認器械與安全設定。","source":"Module 2 Exercise Guide p.3","move":"Reformer Hundred","cue":"「吸五拍、吐五拍，讓肩頸放鬆，腹部保持向內提。」"},{"id":"ref-shortspine","cat":"Reformer","q":"Short Spine Massage 的次數與重點安全輔助？","a":"5 次、參考表 2 條彈簧；屬 Level I Mandatory Spot，教師應在指定階段引導足部與腰背控制。","source":"Module 2 Exercise Guide p.3、p.6","move":"Short Spine Massage","cue":"「先確認器械與安全輔助，再依實際教學順序帶動作。」"},{"id":"ref-stomach","cat":"Reformer","q":"Stomach Massage：Round、Hands Back、Reaching 的次數與彈簧？","a":"Round：10 次／3–4；Hands Back：10 次／3；Reaching：5 次／2（依教材清單）。","source":"Module 2 Exercise Guide p.3","move":"Stomach Massage Series","cue":"「把腹部向內提，伸長身體，再有控制地回來。」"},{"id":"ref-longbox","cat":"Reformer","q":"Pulling Straps I & II 的次數及彈簧？","a":"Long Box Series 的 Pulling Straps I & II：各 3–5 次，參考彈簧 1。","source":"Module 2 Exercise Guide p.3","move":"Pulling Straps","cue":"「手臂往腳的方向伸長，從背部帶動，回來保持控制。」"},{"id":"ref-elephant","cat":"Reformer","q":"Elephant 為什麼需要 Foot Spot？","a":"學員雙手放上 footbar 進出器械時須以教師腳部固定腳踏桿；Elephant 為例，5–10 次、參考彈簧 2。","source":"Module 2 Exercise Guide p.3、p.6–7","move":"Elephant","cue":"「雙手先扶穩，讓我固定腳踏桿；再安全踏上滑床。」"},{"id":"ref-knee","cat":"Reformer","q":"Knee Stretch Round／Flat／Knees Off 的推薦次數？","a":"Round 5–10、Flat 5–10、Knees Off 5–20，清單都列 2 條彈簧。","source":"Module 2 Exercise Guide p.3","move":"Knee Stretch Series","cue":"「先穩住肩膀和核心，腿把滑床推出，再慢慢拉回。」"},{"id":"ref-running","cat":"Reformer","q":"Running 和 Pelvic Lift 的次數與彈簧設定？","a":"兩者都列 10 次、參考 3–4 條彈簧；學員實際操作需依器械與能力決定。","source":"Module 2 Exercise Guide p.3","move":"Running","cue":"「腳跟交替向下延伸，維持腿和骨盆的穩定。」"},{"id":"method-5part","cat":"教學法","q":"Peak Pilates 5-Part Formula 包含哪些部分？","a":"Peak Principles、Session Format、Teaching Methodology、Presentation Skills、Progression Guidelines。","source":"5-Part Formula p.2–5","move":"","cue":"「今天我會先讓你找到起始位置，跟著動作慢慢開始。」"},{"id":"method-flow","cat":"教學法","q":"Level I 最優先的口令與教學技巧？","a":"清楚 Setup 和 Execution、保持 Flow、每動作一個 Powerhouse cue，並透過節奏與聲音帶動學員。","source":"5-Part Formula p.3","move":"","cue":"「先讓動作開始，等穩定後再給一個清楚的提醒。」"},{"id":"method-cue","cat":"教學法","q":"看到學員做錯時，應該一次說幾個修正？","a":"一次先給一個可執行的修正，使用正向口令並觀察是否有效。","source":"Teaching with the 5-Part Formula Handout p.2","move":"","cue":"「我們先讓骨盆保持穩定，動作幅度小一些。」"},{"id":"method-format","cat":"教學法","q":"Level I 的 Session Format 時間建議為何？","a":"Part A Mat 15–20 分、Part B Reformer 20 分、Part C Individual Needs 10 分、Part D Ending 5 分；Level I A/B 可交換。","source":"5-Part Formula p.2","move":"","cue":"「我們先用基礎動作暖身，再把同樣的穩定帶到器械。」"},{"id":"method-progression","cat":"教學法","q":"每堂課新加入多少動作／變化？","a":"教材建議每個器械至多引入一項新動作或變化，整堂約 3–4 項，仍要依學員準備程度調整。","source":"5-Part Formula p.5","move":"","cue":"「先把這個版本練順，再往下一個挑戰前進。」"},{"id":"fundamental-power","cat":"教學法","q":"Scoop 的意義與自然中文口令？","a":"教材指腹部向內、向上連結 Powerhouse；中文可以說「吐氣時腹部輕輕往內、向上提」。","source":"The Spine, Pelvis and Breathing p.2","move":"","cue":"「吐氣時，輕輕把腹部往內、向上提，身體維持拉長。」"},{"id":"fundamental-three","cat":"教學法","q":"Three Anchors 指的是哪三個？","a":"內側大腿、下腹部（恥骨到肚臍）及坐骨。","source":"Building Your Vocabulary handout p.1","move":"","cue":"「內側大腿有連結感，腹部向內提，坐骨穩穩支持身體。」"}];

function reviewDeck(){let xs=STUDY_CARDS.filter(c=>(reviewUI.cat==='全部'||c.cat===reviewUI.cat)&&(!reviewUI.onlyWrong||state.reviewResults[c.id]?.status==='retry'||state.reviewStars[c.id]));return xs.sort((a,b)=>{let priority=c=>state.reviewStars[c.id]?0:state.reviewResults[c.id]?.status==='retry'?1:state.reviewResults[c.id]?.status==='know'?3:2;return priority(a)-priority(b)});}

let comparisonUI={area:'mat',onlyDiff:false,query:''};
function renderComparisonRows(){
  const area=comparisonUI.area,rows=EXAM_SOURCE[area]||[],q=(comparisonUI.query||'').trim().toLowerCase();
  return rows.map((x,i)=>({x,i})).filter(({x})=>!comparisonUI.onlyDiff||x._getItMoving.hasDifference)
    .filter(({x})=>!q||[x.name,x._module2Reference?.name,x._getItMoving.cue,x._getItMoving.difference].join(' ').toLowerCase().includes(q))
    .map(({x,i})=>{
      const g=x._getItMoving,m=x._module2Reference;
      const gimValue=g.rep+' '+g.unit+(g.springs?' · '+g.springs+' 條彈簧':'');
      const moduleValue=m?m.rep+' '+m.unit+(m.springs?' · '+m.springs+' 條彈簧':''):'原 Part A 清單未列，已補入';
      return '<tr><td>'+String(i+1).padStart(2,'0')+'</td><td><strong>'+escapeHTML(g.name)+'</strong><small>'+escapeHTML(gimValue)+'</small><p class="hint">'+escapeHTML(g.cue)+'</p></td><td><strong>'+escapeHTML(m?.name||'—')+'</strong><small>'+escapeHTML(moduleValue)+'</small></td><td><span class="tag '+(g.hasDifference?'amber':'')+'">'+escapeHTML(g.difference)+'</span></td></tr>';
    }).join('')||'<tr><td colspan="4"><div class="empty">找不到符合的項目。</div></td></tr>';
}

function movementRows(){
 const u=movementReviewUI, app=u.apparatus;
 if(app==='Mat'||app==='Reformer'){
  if(u.module==='module1'){
   const g=window.MODULE1_PLANNER_GROUPS.find(x=>x.apparatus===app&&x.part===(app==='Mat'?'A':'B'));
   return (g?.rows||[]).map(x=>({...x}));
  }
  return (app==='Mat'?EXAM_SOURCE.mat:EXAM_SOURCE.reformer).map(x=>({...x,source:'Module 2 · '+app}));
 }
 const groups=u.module==='module1'?window.MODULE1_PLANNER_GROUPS:PLANNER_GROUPS;
 return groups.filter(g=>g.apparatus===app||(app==='Power Circle · Ending'&&g.apparatus.startsWith('Power Circle'))).flatMap(g=>g.rows.map((r,i)=>({...r,guideKey:`${g.id}:${i}`,name:app==='Power Circle · Ending'?`${g.apparatus}: ${r.name}`:r.name,source:`${u.module==='module1'?'Module 1':'Module 2'} · Part ${g.part}`})));

function partCDProfile(key){return window.PART_CD_PROFILES?.[key]||null;}
function partCDDetails(profile,withImages=false){
 if(!profile)return '';
 return `<div class="partcd-detail"><strong>主要訓練目標</strong><p>${escapeHTML(profile.goal)}</p><strong>可考慮的學生需求</strong><p>${profile.needs.map(n=>`<span class="tag">${escapeHTML(n)}</span>`).join(' ')}</p><p class="hint">${escapeHTML(profile.caution)}</p><small>${escapeHTML(profile.source)}${profile.referenceNote?' · '+escapeHTML(profile.referenceNote):''}</small>${withImages?`<details><summary>查看教材圖（${profile.frames.length} 張）</summary>${profile.frames.length?`<div class="partcd-photo-strip">${profile.frames.map((f,i)=>`<img loading="lazy" src="${escapeHTML(f)}" alt="${escapeHTML(profile.name)} 教材參考圖 ${i+1}">`).join('')}</div><p class="hint">${escapeHTML(profile.imageNote||'依教材圖序核對設定與動作。')}</p>`:'<p class="hint">本檔未附此動作的專屬圖解，未使用其他器械圖片替代。</p>'}</details>`:''}</div>`;
}
function movementKey(row){return `motion-${movementReviewUI.module}-${movementReviewUI.apparatus}-${row.name}`;}
function normalizeMovementName(value){return String(value||'').toLowerCase().replace(/&/g,' and ').replace(/triceps/g,'tricep').replace(/[^a-z0-9]+/g,' ').replace(/\b(series|the|prep|support|introductory|and)\b/g,' ').replace(/\s+/g,' ').trim();}
function movementMediaFor(name){
 const current=movementRows().find(r=>r.name===name),profile=partCDProfile(current?.guideKey);
 if(profile)return profile.frames.length?profile:null;
 const u=movementReviewUI,target=normalizeMovementName(String(name||'').split('/')[0]),tokens=target.split(' ').filter(Boolean);
 const list=(window.MOVEMENT_MEDIA||[]).filter(x=>x.module===u.module&&x.apparatus===u.apparatus);
 let found=list.find(x=>normalizeMovementName(x.name)===target);
 if(!found) found=list.find(x=>{const key=normalizeMovementName(x.name);return key&&(key.includes(target)||target.includes(key));});
 if(!found) found=list.find(x=>{const keyTokens=new Set(normalizeMovementName(x.name).split(' ').filter(Boolean));return tokens.length>=2&&tokens.every(token=>keyTokens.has(token));});
 return found||null;

function renderMovementReview(){

 }

 return html;

function itemText(it,short=false){if(!it)return '';return [`【${it.name}｜${PHASES[it.phase]||'動作'}】`,...previewFields(it,short).filter(k=>String(it[k]||'').trim()).map(k=>`${workspaceFieldTitle(it,k)}：${it[k]}`)].join('\n\n')}
function allText(){let l=lesson();return [l.name,`${l.audience}｜${l.apparatus}｜預計 ${l.duration} 分鐘`,workspaceGoal(l)?`本次重點：${workspaceGoal(l)}`:'',...l.items.map(it=>itemText(it))].filter(Boolean).join('\n\n────────────────────────\n\n')}
async function copyText(t){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(t);else{let el=document.createElement('textarea');el.value=t;el.style.position='fixed';el.style.left='-9999px';document.body.appendChild(el);el.select();if(!document.execCommand('copy'))throw Error('copy');el.remove()}toast('已複製，可以貼到筆記中')}catch(e){toast('無法直接複製，請使用匯出文字檔')}}
function downloadFile(name,content,mime){let blob=new Blob([content],{type:mime});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){downloadFile('FlowNotes-我的教課備份-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({version:3,exported:new Date().toISOString(),data:state,examData:examState},null,2),'application/json;charset=utf-8');toast('已匯出 JSON 備份')}
function importJSON(file){let reader=new FileReader();reader.onload=()=>{try{let parsed=JSON.parse(reader.result),x=parsed.data||parsed;if(parsed.type==='flow-notes-student'){if(!confirm('將新增這位學生及相關紀錄；已存在的學生會另存副本，不覆蓋其他學生或學習進度。繼續？'))return;importStudentBundle(parsed);nav('students');toast('學生備份已還原為獨立副本');return;}if(parsed.progress&&typeof parsed.progress==='object'&&!Array.isArray(x.lessons)){if(!confirm('這是舊版考試紀錄備份。合併後會保留逐題作答、Part C 案例與練習位置，不會覆蓋逐字稿。繼續匯入？'))return;mergeLegacyProgress(parsed.progress);saveExam();render();toast('舊版考試紀錄已合併並保留');return}if(!Array.isArray(x.lessons)||!x.lessons.length||!x.lessons.every(y=>Array.isArray(y.items)))throw Error('bad data');normalizeRecords(x);if(!confirm('匯入會覆蓋目前全部課程、學生、課次紀錄與筆記。舊備份可能不含學生與課次，請先匯出目前資料。確定繼續嗎？'))return;state=x;if(parsed.examData&&typeof parsed.examData==='object'){examState=normalizeExam(parsed.examData);saveExam()}state.journal=Array.isArray(x.journal)?x.journal:[];state.phrases=Array.isArray(x.phrases)?x.phrases:[];state.reviewResults=x.reviewResults&&typeof x.reviewResults==='object'?x.reviewResults:{};state.reviewStars=x.reviewStars&&typeof x.reviewStars==='object'?x.reviewStars:{};state.tab='lessons';state.selectedItemId=null;state.previewMode='full';state.activeId=state.lessons.find(z=>z.id===state.activeId)?.id||state.lessons[0].id;save();nav('lessons');toast('資料匯入完成')}catch(e){toast('這不是有效的 Flow Notes JSON 備份')}};reader.readAsText(file)}
function makePracticeCards(){return lesson().items.flatMap(it=>previewFields(it,state.previewMode==='short').filter(k=>String(it[k]||'').trim()).map(k=>({id:it.id,name:it.name,phase:PHASES[it.phase]||'動作練習',field:workspaceFieldTitle(it,k).replace(/[①②③④⑤⑥] /,''),text:it[k]})))}
function startPractice(fromId){pCards=makePracticeCards();if(!pCards.length){toast('請先寫一段逐字稿');return}let pos=fromId?pCards.findIndex(x=>x.id===fromId):0;pIndex=Math.max(0,pos);pElapsed=0;pStart=Date.now();pPaused=false;pFont=window.innerWidth<690?7:3;document.getElementById('rehearsal').classList.add('open');document.getElementById('practiceTitle').textContent=lesson().name;document.body.style.overflow='hidden';clearInterval(pTimer);pTimer=setInterval(updateClock,250);document.getElementById('practiceToggleTimer').textContent='暫停計時';updatePractice();updateClock()}
function updateClock(){let s=Math.floor((pElapsed+(pPaused?0:Date.now()-pStart))/1000);document.getElementById('practiceClock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function updatePractice(){let c=pCards[pIndex];if(!c)return;document.getElementById('practicePhase').textContent=c.phase+' · '+c.field;document.getElementById('practiceHeading').textContent=c.name;const script=document.getElementById('practiceScript');script.textContent=c.text;script.style.setProperty('--tele-size',pFont+'vw');document.getElementById('practiceCount').textContent=`${pIndex+1} / ${pCards.length}`;document.getElementById('practiceProgress').style.width=100*(pIndex+1)/pCards.length+'%';document.getElementById('practicePrev').disabled=pIndex===0;document.getElementById('practiceNext').textContent=pIndex===pCards.length-1?'完成練習 ✓':'下一句 →'}
function closePractice(){document.getElementById('rehearsal').classList.remove('open');document.body.style.overflow='';clearInterval(pTimer)}
function changeStep(v){if(pIndex+v>=pCards.length){closePractice();toast('練習完成！可以到「課後復盤」記一句想修正的話');return}pIndex=Math.max(0,pIndex+v);updatePractice()}
document.getElementById('practiceMarkSmooth').addEventListener('click',()=>{let c=pCards[pIndex];if(c){examState.practiceScores[c.id]='smooth';saveExam();toast('已記錄：這段說得順')}});
document.getElementById('practiceMarkPractice').addEventListener('click',()=>{let c=pCards[pIndex];if(c){examState.practiceScores[c.id]='retry';saveExam();toast('已標記需要再練')}});
document.getElementById('mainNav').addEventListener('click',e=>{const group=e.target.closest('[data-nav-group]');if(group){navOpenGroup=navOpenGroup===group.dataset.navGroup?null:group.dataset.navGroup;renderNavigation();return}const btn=e.target.closest('[data-tab]');if(btn){if(btn.dataset.reviewArea)reviewUI.area=btn.dataset.reviewArea;nav(btn.dataset.tab)}});
document.getElementById('rehearseBtn').addEventListener('click',()=>startPractice());document.getElementById('copyFullBtn').addEventListener('click',()=>copyText(allText()));document.getElementById('backupBtn').addEventListener('click',exportJSON);document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile').addEventListener('change',e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value=''});
document.getElementById('closePractice').addEventListener('click',closePractice);document.getElementById('practicePrev').addEventListener('click',()=>changeStep(-1));document.getElementById('practiceNext').addEventListener('click',()=>changeStep(1));document.getElementById('fontSmaller').addEventListener('click',()=>{pFont=Math.max(1.5,pFont-.5);updatePractice()});document.getElementById('fontLarger').addEventListener('click',()=>{pFont=Math.min(10,pFont+.5);updatePractice()});document.getElementById('practiceToggleTimer').addEventListener('click',e=>{if(pPaused){pStart=Date.now();pPaused=false;e.currentTarget.textContent='暫停計時'}else{pElapsed+=Date.now()-pStart;pPaused=true;e.currentTarget.textContent='繼續計時'}updateClock()});
document.addEventListener('keydown',e=>{if(!document.getElementById('rehearsal').classList.contains('open'))return;if(e.key==='Escape')closePractice();if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();changeStep(1)}if(e.key==='ArrowLeft'){e.preventDefault();changeStep(-1)}});

function plannerReformerModuleLabel(x,g){
 if(g.id!=='B_REFORMER'||plannerModule()!=='module2')return '';
 const m1=window.MODULE1_PLANNER_GROUPS.find(group=>group.id==='M1_B_REFORMER');
 if(!m1)return `Module 2 #${String(x.index+1).padStart(2,'0')}`;
 const norm=value=>nameNorm(String(value||'').replace(/\bSeries\b/gi,'').replace(/\bTriceps?\b/gi,'tricep').replace(/\s*&\s*/g,' and '));
 const rowName=norm(x.name),matches=new Set();
 m1.rows.forEach((row,index)=>{if(norm(row.name)===rowName)matches.add(index+1)});
 const cues=(window.GET_IT_MOVING_CUES?.reformer||[]).filter(cue=>norm(cue.module2Name)===rowName);
 for(const cue of cues){

}

function plannerResolve(key){let [id,raw]=String(key||'').split(':'),g=ALL_PLANNER_GROUPS.find(x=>x.id===id),i=Number(raw);if(!g||!Number.isInteger(i)||i<0||i>=g.rows.length)return null;return {g,i,row:g.rows[i],key}}
function plannerMakeItem(x){let {g,row,key}=x;
 let candidates=library.filter(v=>(g.part==='A'&&v.apparatus==='Mat')||(g.part==='B'&&v.apparatus==='Reformer'));
 let match=candidates.find(v=>nameNorm(v.name)===nameNorm(row.name));
 if(!match && g.part==='B'&&row.name==='Hundred')match=library.find(v=>v.name==='Reformer Hundred');
 let item=match?fromLibrary(match.name):ex(row.name,'',g.part==='D'?'ending':'dynamic',2,'','','','','','','','');
 item.name=row.name;item.apparatus=g.apparatus;item.part=g.part;item.guideGroup=g.title;item.guideId=key;item.repetitions=row.rep;item.springs=row.springs||'';
 item.plannerModule=g.module||'module2';item.source=row.source||((g.part==='A'||g.part==='B')?'Get It Moving Cues':`Module 2 Reference Guide p.${g.sourcePage}`);item.source+=` · Part ${g.part} · ${g.title}（次數／彈簧參考）`;
 if(!match){item.en=`Part ${g.part} · ${g.title}`;item.mins=2}
 const basic=basicCueFor(item);if(basic){for(const field of BASIC_CUE_FIELDS)item[field]=basic[field];item.basicCueReference=basic.reference;item.source+=' · '+basic.reference+'（基本口令改寫）'}
 return item;
}
function plannerRank(item){if(item.phase==='fundamentals')return .5;if(item.part)return {A:1,B:2,C:3,D:4}[item.part]||3;if(item.phase==='opening')return 0;if(item.phase==='centering')return .5;if(item.phase==='ending')return 4;return item.apparatus==='Reformer'?2:item.apparatus==='Mat'?1:3}
function plannerKeyOrder(key){let x=plannerResolve(key);return x?plannerGroups().findIndex(g=>g.id===x.g.id)*1000+x.i:999999}
function plannerAddKeys(keys){let current=lesson(),added=0,already=0,omit=0;
 for(let key of keys){let x=plannerResolve(key);if(!x)continue;
 if(plannerInLesson(key)){already++;continue}
 if(current.firstLesson && x.g.part==='A'&&/Rolling Like a Ball|^Seal$/i.test(x.row.name)){omit++;continue}
 let item=plannerMakeItem(x),rank=plannerRank(item),order=plannerKeyOrder(key);
 let where=current.items.findIndex(y=>plannerRank(y)>rank || (plannerRank(y)===rank&&plannerItemOrder(y)!==null&&plannerItemOrder(y)>order));
 if(where<0)current.items.push(item);else current.items.splice(where,0,item);
 added++;
 }
 plannerUI.selected.clear();if(added){save();render();toast(`已加入 ${added} 項動作；可接著編寫逐字稿`)}else{render();toast(omit?'首堂課限制：Rolling Like a Ball / Seal 未加入':'這些動作已在目前課程中')}

 return {added,already,omit}
}

 if(action==='plannerSort'){let current=lesson(),eligible=current.items.filter(it=>plannerItemOrder(it)!==null).sort((a,b)=>plannerItemOrder(a)-plannerItemOrder(b)),i=0;current.items=current.items.map(it=>plannerItemOrder(it)!==null?eligible[i++]:it);save();render();toast('已依 '+plannerModuleLabel()+' 排序，逐字稿已保留');return}

function mergeLegacyProgress(imported){
  let old=imported;
  if(!old){try{const raw=sessionStorage.getItem('office_practice_legacy_v1');if(!raw)return;old=JSON.parse(raw)}catch(e){return}}
  if(!old||typeof old!=='object')return;
  const previous=examState.legacyArchive||{};
  const scoreList=[...(Array.isArray(previous.scores)?previous.scores:[]),...(Array.isArray(old.scores)?old.scores:[])];
  const seen=new Set(),scores=scoreList.filter(x=>{const key=JSON.stringify(x);if(seen.has(key))return false;seen.add(key);return true});
  const cases={...(previous.cases||{}),...(old.cases&&typeof old.cases==='object'?old.cases:{})};
  const sequence={...(previous.sequence||{}),...(old.sequence&&typeof old.sequence==='object'?old.sequence:{})};
  const snapshot={...(previous.snapshot||{}),...old,cases,sequence};
  examState.legacyArchive={sourceKey:'office_practice_legacy_v1',scores,cases,sequence,partScores:old.partScores??previous.partScores??0,snapshot,importedAt:previous.importedAt||new Date().toISOString(),lastSyncedAt:new Date().toISOString()};
  for(const item of LEGACY_EXAM_CASES){
    const answer=cases[item.id];
    if(!answer||(!Array.isArray(answer.selected)&&!answer.reason))continue;
    const caseIndex=EXAM_SOURCE.cases.findIndex(x=>x.legacyId===item.id);
    if(caseIndex<0)continue;
    const key='c'+caseIndex,existing=examState.caseAnswers[key];
    if(existing&&!existing.legacySourceSnapshot)continue;
    const selected=Array.isArray(answer.selected)?answer.selected:[];
    const choices=selected.map(id=>item.choices.findIndex(([choiceId])=>choiceId===id)).filter(i=>i>=0);
    examState.caseAnswers[key]={choices,reason:answer.reason||'',at:answer.at||new Date().toISOString(),legacySourceSnapshot:JSON.stringify(answer)};
  }
  saveExam();
}

function handleExamAction(btn){let a=btn.dataset.action;

 if(a==='examCheckABCD'){let goals=[['A','Mat','15-20'],['B','Reformer','20'],['C','Individual Needs','10'],['D','Ending','5']];let hit=0,html='';goals.forEach(([p,n,t])=>{let ok=document.getElementById('abc'+p)?.value===n&&numRange(document.getElementById('tm'+p)?.value).join(',')===numRange(t).join(',');hit+=ok?1:0;html+=`Part ${p}：${n} · ${t} 分鐘 ${answerBadge(ok)}<br>`;rememberGrade('session:Part '+p,ok,'abc')});let f=document.getElementById('abcFeedback');f.className='quiz-feedback';f.innerHTML='<strong>'+hit+'/4 正確</strong><br>'+html+'<br>Level I：A、B 可交換順序。';return}
 if(a==='caseNext'||a==='casePrev'){eUI.case=Math.max(0,Math.min(EXAM_SOURCE.cases.length-1,eUI.case+(a==='caseNext'?1:-1)));render();return}

// Student profiles and dated teaching/observation records share the existing backup.
function normalizeRecords(data){
 for(const key of ['students','sessions']){
  if(data[key]!==undefined&&(!Array.isArray(data[key])||!data[key].every(x=>x&&typeof x==='object'&&typeof x.id==='string')))throw Error('Invalid '+key);
  if(!data[key])data[key]=[];
 }
 for(const s of data.sessions){
  if(s.actual!==undefined&&(!Array.isArray(s.actual)||!s.actual.every(x=>x&&typeof x.id==='string')))throw Error('Invalid actual order');
  if(s.planSnapshot&&(!Array.isArray(s.planSnapshot.items)))throw Error('Invalid plan snapshot');
  s.actual=s.actual||[];
 }
 for(const student of data.students){if(student.bodyNotes!==undefined&&(!Array.isArray(student.bodyNotes)||!student.bodyNotes.every(h=>h&&typeof h.id==='string'&&['category','region','side','summary','detail','source','status','date','eventDate','guidance','deletedAt'].every(k=>h[k]===undefined||typeof h[k]==='string')&&(h.revisions===undefined||Array.isArray(h.revisions)))))throw Error('Invalid body notes');}
 if(data.journal!==undefined&&(!Array.isArray(data.journal)||!data.journal.every(j=>j&&typeof j.id==='string'&&['studentId','sessionId'].every(k=>j[k]===undefined||typeof j[k]==='string'))))throw Error('Invalid journal links');
 data.recordsVersion=1;return data;
}

function updateSessionClock(){
 const s=recordSession();if(!s||s.status==='completed'||!s.classStartedAt)return;
 const elapsed=Math.max(0,Date.now()-Date.parse(s.classStartedAt)),seconds=Math.floor(elapsed/1000),clock=document.getElementById('sessionElapsed');
 if(clock)clock.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
 const target=Math.max(1,Number(sessionPlan(s).duration)||50)*60000;
 if(elapsed>=target&&!s.durationPromptedAt&&state.tab==='sessions'){s.durationPromptedAt=new Date().toISOString();save();if(confirm(`已達預計上課時間 ${Math.round(elapsed/60000)} 分鐘。要結束本次課堂嗎？結束後備課與紀錄會保留，只能繼續填寫「可改進的地方」。`)){finishSession(s);save();render();toast('本次課堂已結束；可補寫改進事項')}else{const hint=document.getElementById('sessionTimerHint');if(hint)hint.textContent='已超過預計課長；計時仍在繼續，可按「結束本次課堂」完成。'}}
}
function startSessionClock(){if(sessionClockInterval)return;sessionClockInterval=setInterval(updateSessionClock,1000);updateSessionClock()}

 return `<section class="record-banner"><div><strong>${s?escapeHTML(s.date)+' · '+escapeHTML(recordStudentName(s))+' · '+recordRole(s.role):'這份備課要用在哪一天？'}</strong><p class="hint">${s?(s.status==='completed'?'本次歷史已保留完成時版本。這裡的後續修改不會改寫歷史。':'這是本次專用的備課與逐字稿，可隨時回到課次紀錄填寫結果。'):'選日期與學生，建立本次專用副本，並記錄課前狀況及課後結果。'}</p></div><button class="button primary" data-action="${s?'recordOpen':'recordFromPlan'}" ${s?'data-id="'+escapeHTML(s.id)+'"':''}>${s?'回到本次紀錄 →':'＋ 安排日期與學生'}</button></section>`;
}
function makeSession(values,source){
 const id=uid(),student=recordStudent(values.studentId),plan=source?clone(source):{name:'空白備課',apparatus:'Mat',audience:'',duration:50,goal:'',firstLesson:false,items:[],notes:'',plannerModule:values.module||'module1'};
 plan.id=uid();plan.sessionId=id;plan.items.forEach(x=>x.id=uid());plan.name=`${values.date} · ${student?.name||'未指定學生'} · 本次備課`;
 const s={id,title:values.title||`${recordRole(values.role)}｜${student?.name||'課程觀察'}`,date:values.date,time:values.time||'',studentId:student?.id||'',studentName:student?.name||'',role:values.role==='observe'?'observe':'teach',status:'planned',lessonId:plan.id,planSnapshot:clone(plan),actual:[],createdAt:new Date().toISOString()};
 state.lessons.unshift(plan);state.sessions.unshift(s);syncActual(s);return s;
}
function syncActual(s){const plan=sessionPlan(s);for(const item of plan.items){if(!s.actual.some(r=>r.planItemId===item.id))s.actual.push({id:uid(),planItemId:item.id,name:item.name,status:'pending',note:''})}}
function finishSession(s){s.planSnapshot=clone(sessionPlan(s));s.planSnapshot.goal=workspaceGoal(sessionPlan(s));s.status='completed';s.completedAt=new Date().toISOString()}
function handleRecordAction(btn){
 const a=btn.dataset.action,id=btn.dataset.id,s=recordSession();
 if(a==='recordNewStudent'){recordsUI.newStudent=true;nav('students');return}
 if(a==='recordCancelStudent'){recordsUI.newStudent=false;render();return}
 if(a==='recordStudent'){healthUI.editId='';healthUI.query='';healthUI.category='';healthUI.status='';state.activeStudentId=id;nav('students');return}
 if(a==='recordForStudent'){beginRecord({studentId:id});return}
 if(a==='recordNew'){beginRecord();return}
 if(a==='recordFromPlan'){beginRecord({sourceId:lesson().id});return}
 if(a==='recordCancelNew'){recordsUI.newSession=false;render();return}
 if(a==='recordOpen'){state.activeSessionId=id;recordsUI.newSession=false;nav('sessions');return}
 if(a==='recordList'){state.activeSessionId=null;recordsUI.newSession=false;nav('sessions');return}
 if(a==='recordTimerStart'){s.classStartedAt=new Date().toISOString();delete s.durationPromptedAt;save();render();return}
 if(a==='recordTimerFinish'){if(confirm('結束本次課堂？結束後備課與紀錄會保留，只能繼續填寫「可改進的地方」。')){finishSession(s);save();render();toast('本次課堂已結束；可補寫改進事項')}return}
 if(!s)return;
 if(a==='recordNext'){beginRecord({studentId:s.studentId,fromSessionId:s.id});return}
 if(a==='recordEditPlan'||a==='recordPreview'){
  if(s.status==='completed')return;
  let plan=state.lessons.find(l=>l.id===s.lessonId);
  if(!plan){plan=clone(s.planSnapshot||{items:[],apparatus:'Mat',duration:50,name:s.title});plan.id=uid();plan.sessionId=s.id;s.lessonId=plan.id;state.lessons.unshift(plan)}
  state.activeId=plan.id;state.selectedItemId=null;plannerUI.selected.clear();if(a==='recordPreview')workspaceSetStep('preview');else nav('lessons');return;
 }
 if(a==='recordSync'){syncActual(s);save();render();toast('已補入新增動作，原有結果保留');return}
 if(a==='recordMove'){const i=s.actual.findIndex(x=>x.id===id),j=i+Number(btn.dataset.dir);if(i>=0&&j>=0&&j<s.actual.length)[s.actual[i],s.actual[j]]=[s.actual[j],s.actual[i]];save();render();return}
 if(a==='recordComplete'){if(!s.date||!s.result?.trim()){toast('請先填寫日期與本次結果');return}finishSession(s);save();render();toast('已完成，並保留當時的備課版本');return}
 if(a==='recordCancel'){s.status='cancelled';save();render();return}
 if(a==='recordRestore'){s.status='planned';save();render();return}
 if(a==='recordExport'){downloadFile('課次紀錄-'+s.date+'.txt',recordText(s),'text/plain;charset=utf-8');toast('已匯出本次紀錄');return}
}
function recordText(s){
 const p=sessionPlan(s),labels={reported:'學生自述',observed:'實際觀察',assessment:'判斷與依據',goal:'本次目標',adaptations:'選課理由與調整',teacherCues:'授課口令／示範',studentResponse:'學生反應',takeaway:'觀課收穫與問題',result:'本次結果',feedback:'學生回饋',effective:'有效調整',nextSteps:'下次追蹤',improvements:'可改進的地方'};
 return [s.title,`${s.date} ${s.time||''}｜${recordStudentName(s)}｜${recordRole(s.role)}｜${recordStatus(s.status)}`,`授課者：${s.teacher||'未填'}｜場地：${s.place||'未填'}`,...Object.entries(labels).map(([k,l])=>`${l}\n${s[k]||'未填'}`),'備課順序\n'+p.items.map((x,i)=>`${i+1}. ${x.name}`).join('\n'),'實際順序\n'+s.actual.map((x,i)=>`${i+1}. ${x.name}｜${({pending:'尚未記錄',done:'完成',adjusted:'調整後完成',skipped:'略過',observed:'已觀察'})[x.status]||x.status}\n${x.note||''}`).join('\n')].join('\n\n');
}

 const rf=document.getElementById('recordSessionForm');if(rf)rf.addEventListener('submit',e=>{e.preventDefault();const v=Object.fromEntries(new FormData(rf));if(!v.date){toast('請選擇日期');return}const prev=state.sessions.find(x=>x.id===recordsUI.fromSessionId),source=v.sourceId==='previous'&&prev?sessionPlan(prev):state.lessons.find(x=>x.id===v.sourceId);const s=makeSession(v,source);if(prev){s.carriedNext=prev.nextSteps||'';s.goal=prev.nextSteps||''}state.activeSessionId=s.id;recordsUI.newSession=false;save();render()});
 const af=document.getElementById('recordActualForm');if(af)af.addEventListener('submit',e=>{e.preventDefault();const name=new FormData(af).get('name').trim();if(!name)return;recordSession().actual.push({id:uid(),name,status:'pending',note:''});save();render()});
 document.querySelectorAll('[data-student-field],[data-session-field],[data-actual-field]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{
  const studentField=el.dataset.studentField,key=studentField||el.dataset.sessionField||el.dataset.actualField;
  const obj=studentField?recordStudent(state.activeStudentId):el.dataset.actualField?recordSession()?.actual.find(x=>x.id===el.dataset.actualId):recordSession();if(!obj)return;
  if(key==='name'&&!el.value.trim())return;obj[key]=el.value;obj.updatedAt=new Date().toISOString();
  if(el.dataset.sessionField==='goal')setRecordGoal(obj,el.value);
  if(key==='studentId')obj.studentName=recordStudent(el.value)?.name||'';
  save();if(el.tagName==='SELECT'&&!el.dataset.actualField)render();
 }));
 document.querySelectorAll('[data-record-filter]').forEach(el=>el.addEventListener('change',()=>{recordsUI[el.dataset.recordFilter]=el.value;render()}));
 const search=document.getElementById('recordSearch');if(search)search.addEventListener('input',()=>{recordsUI.query=search.value;document.getElementById('studentList').innerHTML=renderStudentList(search.value.trim().toLowerCase());document.querySelectorAll('#studentList [data-action]').forEach(x=>x.addEventListener('click',handleAction))});
}

function healthText(h){return [healthCategories[h.category],h.region,h.side,(['左側','右側'].includes(h.side)?h.side[0]+String(h.region||'').replace('部',''):''),h.summary,h.detail,h.source,healthStatuses[h.status],h.guidance,h.date,h.eventDate].filter(Boolean).join(' ')}
function healthSelect(name,label,options,value){return `<div class="field"><label for="health-${name}">${label}</label><select id="health-${name}" name="${name}">${options.map(([v,l])=>recOption(v,l,value)).join('')}</select></div>`}
function healthPresetButtons(category,q=''){return (healthPresets[category]||[]).filter(x=>x.includes(q)).map(x=>`<button type="button" class="button tiny" data-health-preset="${escapeHTML(x)}">＋ ${escapeHTML(x)}</button>`).join('')||'<span class="hint">可直接在下方輸入特殊狀況。</span>'}
function saveHealthEntry(studentId,values,editId=''){
 const student=recordStudent(studentId);if(!student)throw Error('請先選擇學生');
 const fields=['category','region','side','summary','detail','source','status','date','eventDate','guidance'];
 const clean=Object.fromEntries(fields.map(k=>[k,String(values[k]||'').trim()]));
 if(!healthCategories[clean.category]||!healthStatuses[clean.status]||!healthSources.includes(clean.source)||!clean.date||!clean.summary||!clean.region)throw Error('請填寫日期、部位與狀況摘要');
 if(clean.category==='surgery'&&['教學觀察','觀課觀察'].includes(clean.source))throw Error('手術史不能由動作觀察推定，請選擇自述、文件或待確認');
 const rows=student.bodyNotes||(student.bodyNotes=[]),existing=editId?rows.find(x=>x.id===editId):null;
 if(editId&&(!existing||existing.deletedAt))throw Error('找不到原紀錄，請重新選擇');
 const now=new Date().toISOString();
 if(existing){const {revisions,...before}=existing;existing.revisions=[...(revisions||[]),clone(before)];Object.assign(existing,clean,{updatedAt:now})}
 else rows.unshift({id:uid(),...clean,createdAt:now,updatedAt:now});
 save();return existing||rows[0];
}
function setHealthRemoved(studentId,id,removed){
 const h=recordStudent(studentId)?.bodyNotes?.find(x=>x.id===id);
 if(!h)throw Error('找不到這位學生的紀錄');
 if(removed)h.deletedAt=new Date().toISOString();else delete h.deletedAt;
 h.updatedAt=new Date().toISOString();save();return h;
}
function renderRemovedHealth(student){

 return rows.length?`<details class="compact-filters" id="removedHealth"><summary>已移除的紀錄 · ${rows.length} 筆（可復原）</summary><p class="hint">誤填的紀錄不再列入追蹤；需要時可復原。</p>${rows.map(h=>`<div class="health-entry"><p>${escapeHTML([h.region,h.side,h.summary].filter(Boolean).join(' · '))}</p><button type="button" class="button tiny" data-action="healthRestore" data-id="${escapeHTML(h.id)}">復原</button></div>`).join('')}</details>`:'';
}
function healthSummary(student){const rows=(student?.bodyNotes||[]).filter(x=>!x.deletedAt&&['tracking','confirm'].includes(x.status));return rows.length?`<div class="health-chips">${rows.map(x=>`<span class="tag">${escapeHTML([healthCategories[x.category],x.region,x.side,x.summary].filter(Boolean).join(' · '))}</span>`).join('')}</div>`:'<p class="hint">尚無待追蹤狀況；空白不代表已確認無限制。</p>'}

 return rows.length?rows.map(h=>`<article class="health-entry"><div class="row between"><strong>${escapeHTML(h.region)} · ${escapeHTML(h.side||'未註明')}</strong><span class="tag">${escapeHTML(healthStatuses[h.status]||h.status)}</span></div><p><b>${escapeHTML(healthCategories[h.category]||h.category)}</b>｜${escapeHTML(h.summary)}</p><p class="hint">記錄：${escapeHTML(h.date)} · ${escapeHTML(h.source)}${h.eventDate?' · 發生／手術日期：'+escapeHTML(h.eventDate):''}</p>${h.detail?`<p class="health-text">${escapeHTML(h.detail)}</p>`:''}${h.guidance?`<p class="health-text"><b>已知限制／專業建議：</b>${escapeHTML(h.guidance)}</p>`:''}<button class="button tiny" data-action="healthEdit" data-id="${escapeHTML(h.id)}">編輯／更新追蹤狀態</button> <button type="button" class="button tiny danger" data-action="healthRemove" data-id="${escapeHTML(h.id)}">移除</button>${h.revisions?.length?`<details><summary>先前版本 · ${h.revisions.length} 筆</summary>${h.revisions.slice().reverse().map(v=>`<p class="hint health-text">${escapeHTML(healthText(v))}</p>`).join('')}</details>`:''}</article>`).join(''):'<p class="hint">沒有符合的狀況紀錄。</p>';

function journalStudentId(j){const session=state.sessions.find(s=>s.id===j.sessionId);return session?session.studentId||'':j.studentId||''}

}

function journalSessionOptions(studentId,selected=''){return recOption('','不連結課次',selected)+state.sessions.filter(s=>s.studentId===studentId).map(s=>recOption(s.id,`${s.date} · ${s.title} · ${recordRole(s.role)}`,selected)).join('')}
function studentJournal(student){const rows=state.journal.filter(j=>journalStudentId(j)===student.id);return `<section class="card"><div class="row between"><h2>這位學生的課後復盤 · ${rows.length} 則</h2><button class="button" data-action="healthJournal" data-id="${escapeHTML(student.id)}">＋ 為這位學生寫復盤</button></div><details ${rows.length?'open':''}><summary>查看／收合復盤紀錄</summary>${journalCards(rows)}</details></section>`}
function filteredJournals(){return state.journal.filter(j=>(!journalUI.filter||(journalUI.filter==='unassigned'?!journalStudentId(j):journalStudentId(j)===journalUI.filter))&&[j.awkward,j.original,j.next,j.win,j.date,recordStudent(journalStudentId(j))?.name].join(' ').toLowerCase().includes(journalUI.query.toLowerCase()))}
function renderJournal(){return hero('課後復盤','選擇學生與課次，記下當次反應、有效口令與下一步。舊筆記保留，可在每則筆記下方補上歸屬。',false)+`<div class="journal-grid"><section class="card"><h2>新增課後復盤</h2><form id="journalForm" class="stack"><div class="field-grid"><div class="field"><label for="journalStudent">學生</label><select id="journalStudent" name="studentId">${recOption('','未指定學生／個人練習',journalUI.studentId)}${state.students.map(s=>recOption(s.id,s.name,journalUI.studentId)).join('')}</select></div><div class="field"><label for="journalSession">關聯課次（選填）</label><select id="journalSession" name="sessionId">${journalSessionOptions(journalUI.studentId,journalUI.sessionId)}</select></div><div class="field"><label for="journalDate">復盤日期</label><input id="journalDate" name="date" type="date" required value="${state.sessions.find(s=>s.id===journalUI.sessionId)?.date||localDate()}"></div><div class="field"><label for="journalRole">我的角色</label><select id="journalRole" name="role">${recOption('teach','我教課',state.sessions.find(s=>s.id===journalUI.sessionId)?.role||'teach')}${recOption('observe','我觀課',state.sessions.find(s=>s.id===journalUI.sessionId)?.role)}</select></div></div><div class="field"><label for="journalAwkward">今天的重點／學生反應</label><textarea id="journalAwkward" name="awkward" required placeholder="哪個動作、什麼表現？今天最卡在哪裡？"></textarea></div><div class="field"><label for="journalOriginal">當時我／老師怎麼說、怎麼調整？</label><textarea id="journalOriginal" name="original"></textarea></div><div class="field"><label for="journalNext">下次想怎麼做／追蹤什麼？</label><textarea id="journalNext" name="next" required></textarea></div><div class="field"><label for="journalWin">這次的進步</label><input id="journalWin" name="win"></div><button class="button primary" type="submit">儲存這次復盤</button></form></section><section class="card"><h2>復盤紀錄</h2><div class="field"><label for="journalFilter">按學生篩選</label><select id="journalFilter">${recOption('','全部學生與個人練習',journalUI.filter)}${recOption('unassigned','未指定學生／舊筆記',journalUI.filter)}${state.students.map(s=>recOption(s.id,s.name,journalUI.filter)).join('')}</select></div><div class="field"><label for="journalSearch">搜尋復盤</label><input id="journalSearch" value="${escapeHTML(journalUI.query)}" placeholder="學生、日期、動作、口令"></div><div id="journalResults">${journalCards(filteredJournals())}</div></section></div>`}
function handleHealthAction(btn){const a=btn.dataset.action;
 if(a==='healthRemove'||a==='healthRestore'){
  try{setHealthRemoved(state.activeStudentId,btn.dataset.id,a==='healthRemove');if(healthUI.editId===btn.dataset.id)healthUI.editId='';render();toast(a==='healthRemove'?'已移除，可在「已移除的紀錄」復原':'已復原身體狀況')}catch(err){toast(err.message)}return;
 }

 if(a==='healthEdit'){healthUI.editId=btn.dataset.id;render();document.getElementById('healthComposer')?.scrollIntoView({block:'start',behavior:'smooth'})}
 if(a==='healthCancel'){healthUI.editId='';render()}
 if(a==='healthJournal'){journalUI.studentId=btn.dataset.id||'';journalUI.sessionId=btn.dataset.session||'';journalUI.filter=journalUI.studentId;nav('journal')}
}
function bindJournalLinks(root=document){
 root.querySelectorAll('[data-journal-student]').forEach(el=>el.addEventListener('change',()=>{const j=state.journal.find(x=>x.id===el.dataset.journalStudent);if(j){linkJournal(j,el.value);save();render()}}));
 root.querySelectorAll('[data-journal-session]').forEach(el=>el.addEventListener('change',()=>{const j=state.journal.find(x=>x.id===el.dataset.journalSession);if(j){linkJournal(j,journalStudentId(j),el.value);save();render()}}));
}
function bindHealth(){
 const form=document.getElementById('healthForm');if(form){form.querySelectorAll('[data-health-region]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('health-region').value=b.dataset.healthRegion}));form.addEventListener('submit',e=>{e.preventDefault();try{saveHealthEntry(form.dataset.studentId,Object.fromEntries(new FormData(form)),form.dataset.editId);healthUI.editId='';render();toast('身體狀況已儲存')}catch(err){toast(err.message)}});
 document.getElementById('health-category').addEventListener('change',e=>{document.getElementById('healthPresets').innerHTML=healthPresetButtons(e.target.value)});
 document.getElementById('healthPresets').addEventListener('click',e=>{const b=e.target.closest('[data-health-preset]');if(!b)return;const input=document.getElementById('health-summary'),parts=input.value.split('；').filter(Boolean);if(!parts.includes(b.dataset.healthPreset))parts.push(b.dataset.healthPreset);input.value=parts.join('；')});
 const refresh=()=>{const box=document.getElementById('healthResults');box.innerHTML=renderHealthCards(recordStudent(state.activeStudentId));box.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',handleAction))};
 document.getElementById('healthSearch').addEventListener('input',e=>{healthUI.query=e.target.value;refresh()});
 for(const [id,key] of [['health-filterCategory','category'],['health-filterStatus','status']])document.getElementById(id).addEventListener('change',e=>{healthUI[key]=e.target.value;refresh()});}
 const jf=document.getElementById('journalForm');if(jf){
 document.getElementById('journalStudent').addEventListener('change',e=>{journalUI.studentId=e.target.value;journalUI.sessionId='';document.getElementById('journalSession').innerHTML=journalSessionOptions(e.target.value)});
 document.getElementById('journalSession').addEventListener('change',e=>{journalUI.sessionId=e.target.value;const s=state.sessions.find(x=>x.id===e.target.value);if(s){document.getElementById('journalDate').value=s.date;document.getElementById('journalRole').value=s.role}});
 jf.addEventListener('submit',e=>{e.preventDefault();const v=Object.fromEntries(new FormData(jf));if(!v.awkward.trim()||!v.next.trim())return;const j={id:uid(),...v,createdAt:new Date().toISOString()};try{linkJournal(j,v.studentId,v.sessionId);state.journal.unshift(j);save();render();toast('已存入這位學生的復盤紀錄')}catch(err){toast(err.message)}});
 const refresh=()=>{const box=document.getElementById('journalResults');box.innerHTML=journalCards(filteredJournals());box.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',handleAction));bindJournalLinks(box)};
 document.getElementById('journalFilter').addEventListener('change',e=>{journalUI.filter=e.target.value;refresh()});document.getElementById('journalSearch').addEventListener('input',e=>{journalUI.query=e.target.value;refresh()});}
 bindJournalLinks();
}

const directoryUI={query:'',student:''};
function courseStudentId(l){const session=state.sessions.find(s=>s.lessonId===l.id);return session?session.studentId||'':l.studentId||''}
function courseCards(){const q=directoryUI.query.trim().toLowerCase();return state.lessons.filter(l=>(!directoryUI.student||(directoryUI.student==='unassigned'?!courseStudentId(l):courseStudentId(l)===directoryUI.student))&&[l.name,recordStudent(courseStudentId(l))?.name,l.apparatus].join(' ').toLowerCase().includes(q)).map(l=>`<article class="course-directory-card"><h2>${escapeHTML(l.name)}</h2><p>${escapeHTML(l.apparatus)} · ${l.items.length} 個段落 · ${escapeHTML(recordStudent(courseStudentId(l))?.name||'尚未歸屬學生')}</p><div class="row"><button class="button primary" data-action="directoryOpen" data-id="${escapeHTML(l.id)}">開啟備課</button>${courseStudentId(l)?`<button class="button" data-action="recordStudent" data-id="${escapeHTML(courseStudentId(l))}">查看學生紀錄</button>`:''}</div><details><summary>設定歸屬學生（不靠課名自動判斷）</summary><label>這份備課的學生<select data-course-student="${escapeHTML(l.id)}">${recOption('','未指定學生／共用範本',courseStudentId(l))}${state.students.map(s=>recOption(s.id,s.name,courseStudentId(l))).join('')}</select></label><p class="hint">若這份備課已有課次，學生歸屬會一起更新。</p></details></article>`).join('')||'<div class="empty">此裝置沒有符合的課程。可用上方「查看雲端資料」確認是否尚未載入。</div>'}
function renderCourseDirectory(){return hero('我的課程安排','直接搜尋學生或課程名稱，再點「開啟備課」。課名含學生名字的舊備課，也會列在這裡。',false)+`<section class="directory-toolbar"><div class="row between"><h2>課程總覽 · ${state.lessons.length} 份</h2><button class="button primary" data-action="newLesson">＋ 新課程</button></div><div class="field-grid"><div class="field"><label for="directorySearch">搜尋學生／課程名稱</label><input id="directorySearch" value="${escapeHTML(directoryUI.query)}" placeholder="例如：Reformer"></div><div class="field"><label for="directoryStudent">按學生查看</label><select id="directoryStudent">${recOption('','全部課程',directoryUI.student)}${recOption('unassigned','未指定學生／共用範本',directoryUI.student)}${state.students.map(s=>recOption(s.id,s.name,directoryUI.student)).join('')}</select></div></div></section><div id="directoryCards" class="stack">${courseCards()}</div>`}
function bindDirectoryCards(root){root.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',handleAction));root.querySelectorAll('[data-course-student]').forEach(el=>el.addEventListener('change',()=>{const l=state.lessons.find(x=>x.id===el.dataset.courseStudent);if(!l)return;l.studentId=el.value;const s=state.sessions.find(x=>x.lessonId===l.id);if(s){s.studentId=el.value;s.studentName=recordStudent(el.value)?.name||''}save();render()}))}
function bindDirectory(){const input=document.getElementById('directorySearch');if(input){const refresh=()=>{const box=document.getElementById('directoryCards');box.innerHTML=courseCards();bindDirectoryCards(box)};input.addEventListener('input',()=>{directoryUI.query=input.value;refresh()});document.getElementById('directoryStudent').addEventListener('change',e=>{directoryUI.student=e.target.value;refresh()});document.querySelectorAll('[data-course-student]').forEach(el=>el.addEventListener('change',()=>{const l=state.lessons.find(x=>x.id===el.dataset.courseStudent);if(!l)return;l.studentId=el.value;const s=state.sessions.find(x=>x.lessonId===l.id);if(s){s.studentId=el.value;s.studentName=recordStudent(el.value)?.name||''}save();render()}))}}
function studentBundle(id){const student=recordStudent(id);if(!student)throw Error('student not found');const sessions=state.sessions.filter(s=>s.studentId===id),lessonIds=new Set(sessions.map(s=>s.lessonId));return {type:'flow-notes-student',version:1,exported:new Date().toISOString(),student:clone(student),lessons:clone(state.lessons.filter(l=>courseStudentId(l)===id||lessonIds.has(l.id))),sessions:clone(sessions),journal:clone(state.journal.filter(j=>journalStudentId(j)===id).map(j=>({...j,studentId:id})))}}
function studentReadable(id){const b=studentBundle(id),s=b.student;return ['學生：'+s.name,'匯出時間：'+new Date().toLocaleString('zh-TW'),'學生目標\n'+(s.goals||''),'原有自述紀錄\n'+(s.reported||''),'初次觀察與變化\n'+(s.baseline||''),'運動經驗\n'+(s.experience||''),'有效口令與偏好\n'+(s.preferences||''),'身體狀況\n'+(s.bodyNotes||[]).filter(h=>!h.deletedAt).map(healthText).join('\n\n'),'課後復盤\n'+b.journal.map(j=>[j.date,j.role?recordRole(j.role):'',j.awkward,j.original,'下次：'+(j.next||''),j.win].filter(Boolean).join('\n')).join('\n\n'),'課程／觀課紀錄\n'+b.sessions.map(recordText).join('\n\n'),'備課逐字稿\n'+b.lessons.map(l=>l.name+'\n'+l.items.map((it,i)=>`${i+1}. ${it.name}\n`+previewFields(it).filter(k=>it[k]).map(k=>workspaceFieldTitle(it,k)+'：'+it[k]).join('\n')).join('\n\n')).join('\n\n')].join('\n\n')}
function studentBackupControls(student){return `<details class="student-backup"><summary>匯出／匯入這位學生的資料</summary><p class="hint">日常跨裝置仍由帳號自動同步。JSON 可匯回系統，文字檔方便閱讀；只包含已歸屬這位學生的資料。</p><div class="row"><button class="button" data-action="directoryStudentBackup" data-id="${escapeHTML(student.id)}">下載學生備份（JSON，可還原）</button><button class="button" data-action="directoryStudentText" data-id="${escapeHTML(student.id)}">下載閱讀版（文字）</button><button class="button" data-action="directoryImportStudent">匯入學生備份</button><button class="button" data-action="directoryForStudent" data-id="${escapeHTML(student.id)}">查看這位學生的備課</button></div></details>`}
function importStudentBundle(bundle){
 const b=clone(bundle);if(b.type!=='flow-notes-student'||b.version!==1||!b.student||typeof b.student.id!=='string'||typeof b.student.name!=='string'||!['lessons','sessions','journal'].every(k=>Array.isArray(b[k])))throw Error('invalid student backup');
 const ids=new Set();for(const row of [b.student,...b.lessons,...b.sessions,...b.journal]){if(!row||typeof row.id!=='string'||ids.has(row.id))throw Error('invalid ids');ids.add(row.id)}
 if(!b.lessons.every(l=>Array.isArray(l.items)&&l.items.every(it=>it&&typeof it.id==='string')))throw Error('invalid lessons');
 normalizeRecords({students:[b.student],sessions:b.sessions,journal:b.journal});
 if(b.sessions.some(s=>s.studentId!==b.student.id)||b.journal.some(j=>j.studentId&&j.studentId!==b.student.id))throw Error('student association mismatch');
 const map=new Map([...ids].map(id=>[id,uid()])),itemMap=new Map();const mapItems=items=>items.forEach(it=>{if(!itemMap.has(it.id))itemMap.set(it.id,uid());it.id=itemMap.get(it.id)});
 const oldStudent=b.student.id;b.student.id=map.get(oldStudent);if(state.students.some(s=>s.id===oldStudent||s.name===b.student.name))b.student.name+='（匯入副本）';
 b.lessons.forEach(l=>{l.id=map.get(l.id);l.studentId=b.student.id;l.sessionId=map.get(l.sessionId)||undefined;mapItems(l.items)});
 b.sessions.forEach(s=>{s.id=map.get(s.id);s.studentId=b.student.id;s.studentName=b.student.name;s.lessonId=map.get(s.lessonId)||'';if(s.planSnapshot){s.planSnapshot.id=s.lessonId||uid();s.planSnapshot.sessionId=s.id;mapItems(s.planSnapshot.items)}s.actual.forEach(a=>{a.id=uid();a.planItemId=itemMap.get(a.planItemId)||undefined})});
 b.journal.forEach(j=>{j.id=map.get(j.id);j.studentId=b.student.id;j.sessionId=map.get(j.sessionId)||''});
 sessionStorage.setItem(KEY+'_before_student_import_v1',JSON.stringify({version:3,data:state,examData:examState}));
 state.students.unshift(b.student);state.lessons.unshift(...b.lessons);state.sessions.unshift(...b.sessions);state.journal.unshift(...b.journal);state.activeStudentId=b.student.id;save();return b.student;
}
function handleDirectoryAction(btn){const a=btn.dataset.action,id=btn.dataset.id;
 if(a==='directoryHome'){directoryUI.query='';directoryUI.student='';nav('courses')}
 if(a==='directoryOpen'){state.activeId=id;state.selectedItemId=null;nav('lessons')}
 if(a==='directoryForStudent'){directoryUI.query='';directoryUI.student=id;nav('courses')}
 if(a==='directoryImportStudent')document.getElementById('importFile').click();
 if(a==='directoryStudentBackup')downloadFile('學生備份-'+recordStudent(id).name+'.json',JSON.stringify(studentBundle(id),null,2),'application/json;charset=utf-8');
 if(a==='directoryStudentText')downloadFile('學生紀錄-'+recordStudent(id).name+'.txt',studentReadable(id),'text/plain;charset=utf-8');
}

initRecords();
state.tab='exam';
render();

})();
</script></body></html>
