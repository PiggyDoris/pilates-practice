:root{font-family:system-ui,sans-serif;color:#293b31;background:#f5f3ec}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1040px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #d7dfd4}a{color:#345d48}header a{padding:10px 14px;border:1px solid #b4c8bb;border-radius:12px;text-decoration:none}h1{font-family:Georgia,serif;font-size:clamp(36px,7vw,60px);margin:24px 0 12px}p{line-height:1.8}.eyebrow{letter-spacing:.16em;font-size:12px;color:#67816f}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 14px}label{display:grid;gap:8px;flex:1;min-width:200px;font-size:14px}input,select{padding:13px;border:1px solid #c9d5c8;border-radius:10px;background:white;font:inherit;width:100%}#status{color:#65796b;font-size:14px}details.note{padding:20px 0;border-bottom:1px solid #d7dfd4}summary{cursor:pointer;font-weight:650;font-size:18px;line-height:1.6}summary small{display:block;font-weight:400;font-size:13px;color:#697f6c;margin-left:20px}.details{padding:10px 20px;max-width:800px}.tag{display:inline-block;background:#e7eee4;padding:5px 10px;border-radius:20px;margin:3px;font-size:13px}.hint{font-size:14px;color:#637269}footer{border-top:1px solid #d7dfd4;font-size:13px;margin-top:40px}#error{color:#9a4228} @media(max-width:500px){header,main,footer{padding:20px}header{font-size:14px}header a{white-space:nowrap}}

</style><header><strong>Pilates Notes</strong><a href="./">回到記憶與考試</a></header><main><p class="eyebrow">MOVEMENT · PURPOSE · PRACTICE</p><h1>從動作，理解教學。</h1><p>瀏覽與練習 Part A 墊上、Part B Reformer、Part C 個別需求與 Part D 收尾動作。依器械或身體需求，找到想進一步了解的動作。</p><p class="hint">訪客唯讀模式。完整記憶、考試與圖像回想可直接使用；此站不連接學生資料、私人備課或帳號。</p><div class="filters"><label>搜尋動作或需求<input id="search" type="search" placeholder="例如：肩膀、平衡、Roll Back"></label><label>器械分類<select id="apparatus"><option value="">全部器械</option></select></label><label>課程部分<select id="part"><option value="">全部 Part A–D</option><option value="A">Part A · Mat</option><option value="B">Part B · Reformer</option><option value="C">Part C · 個別需求</option><option value="D">Part D · 收尾</option></select></label></div><p id="status" role="status" aria-live="polite">載入筆記中…</p><p id="error" role="alert"></p><p><a href="./">進入完整記憶與考試：逐題回憶、完整默寫、次數／彈簧、情境題、圖像回想、教材對照 →</a></p><div class="practice-toolbar"><button id="browseMode" aria-pressed="true">瀏覽筆記</button><button id="practiceMode" aria-pressed="false">記憶練習</button></div><section id="practice" hidden aria-label="訪客記憶練習"></section><div id="notes"></div></main><footer>內容為教學摘要與功能需求整理，並非官方教材原文或醫療處方。Part C 按學生需求選用，並非每堂全部完成。</footer><script src="visitor.js"></script></html>
